# Included in every block that sets its own add_header: nginx drops all inherited
# add_header directives from a block as soon as that block declares one.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Empty (and therefore not sent) unless HTTPS is enforced and this request came over HTTPS.
add_header Strict-Transport-Security $hsts_header always;
