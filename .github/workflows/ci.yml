name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: threatdashboard
          POSTGRES_USER: threatdashboard
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U threatdashboard" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://threatdashboard:ci-password@localhost:5432/threatdashboard
      DJANGO_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pip-audit==2.10.1 bandit==1.9.4
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Static security analysis
        run: bandit -q -r threats config -x threats/tests
      - run: python manage.py check --deploy --fail-level ERROR
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test threats

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm test
      - run: npm run build
